<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="goGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a888"/>
    </linearGradient>
    <linearGradient id="orGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7733"/>
      <stop offset="100%" stop-color="#e85d1a"/>
    </linearGradient>
    <linearGradient id="phpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowCyanRev" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M9,0 L0,3 L9,6 Z" fill="#00d4ff" opacity="0.4"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="620" fill="url(#bg)" rx="12"/>

  <!-- title -->
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">
    lua-resty-yar-grpc-bridge 快速启动
  </text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-size="13">
    gRPC ⇄ Yar 协议桥接 · OpenResty
  </text>

  <!-- ============ TOP: Architecture Flow ============ -->
  <text x="450" y="92" text-anchor="middle" fill="#94a3b8" font-size="12" letter-spacing="2">
    架构数据流
  </text>

  <!-- Go gRPC Client -->
  <rect x="40" y="110" width="200" height="100" rx="14" fill="url(#goGrad)" opacity="0.95"/>
  <text x="140" y="145" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">Go gRPC Client</text>
  <text x="140" y="168" text-anchor="middle" fill="#d1fae5" font-size="11">grpc.NewClient(:1984)</text>
  <text x="140" y="186" text-anchor="middle" fill="#d1fae5" font-size="11">client.Add(15, 27)</text>

  <!-- arrow: Client -> Bridge -->
  <line x1="250" y1="160" x2="350" y2="160" stroke="#00d4ff" stroke-width="2.5" marker-end="url(#arrowCyan)" filter="url(#glow)"/>
  <text x="300" y="148" text-anchor="middle" fill="#00d4ff" font-size="10" font-weight="500">gRPC HTTP/2</text>
  <text x="300" y="178" text-anchor="middle" fill="#475569" font-size="9">/Calculator/Add</text>

  <!-- arrow: Bridge -> Client (response, dashed) -->
  <line x1="350" y1="172" x2="250" y2="172" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.35" marker-end="url(#arrowCyanRev)"/>

  <!-- OpenResty Bridge -->
  <rect x="360" y="110" width="200" height="100" rx="14" fill="url(#orGrad)" opacity="0.95"/>
  <text x="460" y="138" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">OpenResty Bridge</text>
  <text x="460" y="156" text-anchor="middle" fill="#ffedd5" font-size="11">:1984 (HTTP/2)</text>
  <text x="460" y="176" text-anchor="middle" fill="#ffedd5" font-size="10">serve() — 协议转换</text>
  <text x="460" y="192" text-anchor="middle" fill="#ffedd5" font-size="10">bridge.handle()</text>

  <!-- arrow: Bridge -> PHP -->
  <line x1="570" y1="160" x2="670" y2="160" stroke="#00d4ff" stroke-width="2.5" marker-end="url(#arrowCyan)" filter="url(#glow)"/>
  <text x="620" y="148" text-anchor="middle" fill="#00d4ff" font-size="10" font-weight="500">Yar RPC</text>
  <text x="620" y="178" text-anchor="middle" fill="#475569" font-size="9">json / msgpack</text>

  <!-- arrow: PHP -> Bridge (response, dashed) -->
  <line x1="670" y1="172" x2="570" y2="172" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.35" marker-end="url(#arrowCyanRev)"/>

  <!-- PHP Yar Server -->
  <rect x="680" y="110" width="200" height="100" rx="14" fill="url(#phpGrad)" opacity="0.95"/>
  <text x="780" y="145" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">PHP Yar Server</text>
  <text x="780" y="168" text-anchor="middle" fill="#ede9fe" font-size="11">:8888 api.php</text>
  <text x="780" y="186" text-anchor="middle" fill="#ede9fe" font-size="11">class Calculator { add() }</text>

  <!-- ============ MIDDLE: Protocol Conversion ============ -->
  <rect x="360" y="235" width="200" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="460" y="253" text-anchor="middle" fill="#94a3b8" font-size="10">协议转换</text>
  <text x="460" y="270" text-anchor="middle" fill="#cbd5e1" font-size="11">protobuf ⇄ Yar packager</text>

  <!-- connectors to conversion box -->
  <line x1="460" y1="210" x2="460" y2="235" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="460" y1="279" x2="460" y2="300" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- ============ BOTTOM: 4 Steps ============ -->
  <text x="450" y="320" text-anchor="middle" fill="#94a3b8" font-size="12" letter-spacing="2">
    快速启动 4 步
  </text>

  <!-- Step 1 -->
  <rect x="30" y="340" width="195" height="130" rx="12" fill="#1e293b" stroke="#00d4aa" stroke-width="1.5"/>
  <circle cx="55" cy="365" r="14" fill="#00d4aa"/>
  <text x="55" y="370" text-anchor="middle" fill="#0f1923" font-size="14" font-weight="700">1</text>
  <text x="80" y="370" fill="#e2e8f0" font-size="13" font-weight="600">Proto 描述符</text>
  <text x="45" y="395" fill="#94a3b8" font-size="10">protoc --go_out=. \</text>
  <text x="45" y="410" fill="#94a3b8" font-size="10">  --go-grpc_out=. calc.proto</text>
  <text x="45" y="430" fill="#94a3b8" font-size="10">protoc \</text>
  <text x="45" y="445" fill="#94a3b8" font-size="10">  --descriptor_set_out=\</text>
  <text x="45" y="460" fill="#94a3b8" font-size="10">  calc.pb calc.proto</text>

  <!-- arrow step1 -> step2 -->
  <line x1="230" y1="405" x2="250" y2="405" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowCyan)" opacity="0.5"/>

  <!-- Step 2 -->
  <rect x="255" y="340" width="195" height="130" rx="12" fill="#1e293b" stroke="#ff7733" stroke-width="1.5"/>
  <circle cx="280" cy="365" r="14" fill="#ff7733"/>
  <text x="280" y="370" text-anchor="middle" fill="#0f1923" font-size="14" font-weight="700">2</text>
  <text x="305" y="370" fill="#e2e8f0" font-size="13" font-weight="600">启动 PHP Yar</text>
  <text x="270" y="395" fill="#94a3b8" font-size="10">php -d yar.packager=json \</text>
  <text x="270" y="410" fill="#94a3b8" font-size="10">  -S 127.0.0.1:8888 \</text>
  <text x="270" y="425" fill="#94a3b8" font-size="10">  api.php</text>
  <text x="270" y="452" fill="#64748b" font-size="9">⚠ packager 必须显式指定</text>
  <text x="270" y="464" fill="#64748b" font-size="9">  默认 php serialize 不兼容</text>

  <!-- arrow step2 -> step3 -->
  <line x1="455" y1="405" x2="475" y2="405" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowCyan)" opacity="0.5"/>

  <!-- Step 3 -->
  <rect x="480" y="340" width="195" height="130" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="505" cy="365" r="14" fill="#8b5cf6"/>
  <text x="505" y="370" text-anchor="middle" fill="#0f1923" font-size="14" font-weight="700">3</text>
  <text x="530" y="370" fill="#e2e8f0" font-size="13" font-weight="600">配置 OpenResty</text>
  <text x="495" y="395" fill="#94a3b8" font-size="10">init_by_lua_block:</text>
  <text x="495" y="410" fill="#7dd3fc" font-size="9">  require("resty.grpc_yar</text>
  <text x="495" y="422" fill="#7dd3fc" font-size="9">   _bridge").setup {</text>
  <text x="495" y="437" fill="#94a3b8" font-size="9">    services = { ... }</text>
  <text x="495" y="452" fill="#7dd3fc" font-size="9">  }</text>
  <text x="495" y="465" fill="#94a3b8" font-size="10">content_by_lua: serve()</text>

  <!-- arrow step3 -> step4 -->
  <line x1="680" y1="405" x2="700" y2="405" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowCyan)" opacity="0.5"/>

  <!-- Step 4 -->
  <rect x="705" y="340" width="165" height="130" rx="12" fill="#1e293b" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="730" cy="365" r="14" fill="#00d4ff"/>
  <text x="730" y="370" text-anchor="middle" fill="#0f1923" font-size="14" font-weight="700">4</text>
  <text x="755" y="370" fill="#e2e8f0" font-size="13" font-weight="600">gRPC 调用</text>
  <text x="720" y="395" fill="#94a3b8" font-size="10">grpcurl -plaintext \</text>
  <text x="720" y="410" fill="#94a3b8" font-size="10">  -d '{"a":15,"b":27}' \</text>
  <text x="720" y="425" fill="#94a3b8" font-size="10">  127.0.0.1:1984 \</text>
  <text x="720" y="440" fill="#94a3b8" font-size="10">  calculator.Calculator/Add</text>
  <text x="720" y="460" fill="#00d4aa" font-size="10" font-weight="600">→ {"result":42}</text>

  <!-- ============ FOOTER: Key Notes ============ -->
  <rect x="30" y="495" width="840" height="105" rx="10" fill="#0d1420" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="520" fill="#e2e8f0" font-size="12" font-weight="600">关键要点</text>

  <!-- note items -->
  <rect x="50" y="532" width="6" height="6" rx="1" fill="#ff7733"/>
  <text x="65" y="539" fill="#cbd5e1" font-size="10">.pb 描述符: setup() 用 pb.load() 加载，按 {Service}_{Method}Request 约定解析类型名</text>

  <rect x="50" y="552" width="6" height="6" rx="1" fill="#8b5cf6"/>
  <text x="65" y="559" fill="#cbd5e1" font-size="10">packager: PHP 端 yar.packager=json (INI 级别 -d 传入)，Lua 端 options.packager="json"</text>

  <rect x="50" y="572" width="6" height="6" rx="1" fill="#00d4ff"/>
  <text x="65" y="579" fill="#cbd5e1" font-size="10">trailers: OpenResty 不支持直接设 HTTP/2 trailers，用 add_trailer + $grpc_status 变量</text>

  <rect x="50" y="592" width="6" height="6" rx="1" fill="#00d4aa"/>
  <text x="65" y="599" fill="#cbd5e1" font-size="10">方法映射: gRPC path /calculator.Calculator/Add → Yar 方法名 add (自动首字母小写)</text>

  <!-- Docker one-liner badge -->
  <rect x="650" y="515" width="210" height="30" rx="8" fill="#00d4aa" opacity="0.15" stroke="#00d4aa" stroke-width="1"/>
  <text x="755" y="535" text-anchor="middle" fill="#00d4aa" font-size="11" font-family="monospace">./docker-test.sh  # 一键跑 e2e</text>
</svg>
